<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FORGE</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0d0d; --bg2:#141414; --bg3:#1c1c1c; --bg4:#242424;
  --accent:#c8ff00; --accent2:#ff4040; --accent3:#40c8ff; --accent4:#ff9d00;
  --text:#f5f5f0; --text2:#999; --text3:#555;
  --border:#2a2a2a; --radius:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden;user-select:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(110px + var(--safe-bot));scroll-behavior:smooth}
.screen::-webkit-scrollbar{display:none}

/* TOPBAR */
.topbar{padding:calc(var(--safe-top) + 10px) 16px 10px;background:rgba(13,13,13,0.95);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;backdrop-filter:blur(20px)}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;color:var(--accent)}
.topbar-right{display:flex;gap:8px;align-items:center}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(13,13,13,0.97);border-top:1px solid var(--border);display:flex;align-items:center;padding:6px 0 calc(6px + var(--safe-bot));z-index:100;backdrop-filter:blur(20px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:5px 0;transition:all .15s}
.nav-item:active{transform:scale(.9)}
.nav-icon{font-size:20px;line-height:1}
.nav-label{font-size:9px;font-weight:600;letter-spacing:.8px;color:var(--text3);transition:color .15s;text-transform:uppercase}
.nav-item.active .nav-label{color:var(--accent)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;letter-spacing:.3px}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#0d0d0d}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:rgba(255,64,64,.12);color:var(--accent2);border:1px solid rgba(255,64,64,.25)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}
.btn-full{width:100%}
.btn-icon{width:36px;height:36px;padding:0;border-radius:9px}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:10px 14px;transition:border-color .15s}
.card-sm{padding:10px 12px}
.card-title{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px}

/* INPUTS */
input[type=text],input[type=number],input[type=email],textarea,select{background:var(--bg3);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;padding:11px 13px;width:100%;outline:none;transition:border-color .15s;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input[type=number]{font-family:'JetBrains Mono',monospace;font-size:16px;text-align:center}
::placeholder{color:var(--text3)}
select option{background:var(--bg3)}

/* FORM */
.form-group{margin-bottom:12px}
.label{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;letter-spacing:.5px;display:block}

/* SECTION HEADER */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 4px}
.sec-hdr h2{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1.5px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-end;animation:fadeIn .2s ease}
.modal-overlay.center{align-items:center;padding:16px}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:480px;margin:0 auto;padding:18px 16px calc(18px + var(--safe-bot));max-height:92vh;overflow-y:auto;animation:slideUp .28s ease;border-top:1px solid var(--border)}
.modal.center-modal{border-radius:18px;max-height:80vh;padding:18px 16px}
.modal::-webkit-scrollbar{display:none}
.modal-handle{width:32px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;margin-bottom:14px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}

/* TAGS */
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.5px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.tag-accent{background:rgba(200,255,0,.1);color:var(--accent);border-color:rgba(200,255,0,.25)}
.tag-blue{background:rgba(64,200,255,.1);color:var(--accent3);border-color:rgba(64,200,255,.25)}
.tag-orange{background:rgba(255,157,0,.1);color:var(--accent4);border-color:rgba(255,157,0,.25)}
.tag-red{background:rgba(255,64,64,.1);color:var(--accent2);border-color:rgba(255,64,64,.25)}

/* STAT BOX */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-box{background:var(--bg3);border-radius:11px;padding:12px;border:1px solid var(--border)}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600;color:var(--text)}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:2px}

/* REST TIMER */
.rest-timer{position:fixed;bottom:calc(80px + var(--safe-bot));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:452px;background:var(--bg2);border:1px solid rgba(200,255,0,.4);border-radius:13px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:50;animation:slideUp .25s ease;box-shadow:0 0 40px rgba(200,255,0,.1)}
.timer-val{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;color:var(--accent)}
.timer-bar{height:3px;background:var(--border);border-radius:2px;margin-top:5px;overflow:hidden;width:120px}
.timer-bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 1s linear}

/* WORKOUT SCREEN */
.ex-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:8px 14px;overflow:hidden}
.ex-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg3)}
.ex-name{font-size:14px;font-weight:600;color:var(--accent3);cursor:pointer;text-decoration:none}
.ex-name:hover{text-decoration:underline}
.ex-meta{font-size:11px;color:var(--text3);margin-top:2px}
.ex-technique{margin:0 14px 8px;padding:8px 10px;background:rgba(255,157,0,.08);border:1px solid rgba(255,157,0,.2);border-radius:8px;font-size:11px;color:var(--accent4);font-weight:600}
.set-headers{display:grid;grid-template-columns:26px 1fr 1fr 50px 36px;gap:6px;padding:6px 14px;border-top:1px solid var(--border)}
.set-hdr{font-size:10px;font-weight:600;color:var(--text3);text-align:center;letter-spacing:.5px}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr 50px 36px;gap:6px;align-items:center;padding:7px 14px;border-top:1px solid var(--border)}
.set-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);text-align:center}
.set-input{padding:7px 6px;font-size:14px;border-radius:7px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;text-align:center;width:100%;outline:none;transition:border-color .15s;-webkit-appearance:none}
.set-input:focus{border-color:var(--accent)}
.set-rpe{padding:7px 4px;font-size:12px;border-radius:7px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-family:'JetBrains Mono',monospace;text-align:center;width:100%;outline:none;-webkit-appearance:none}
.set-check{width:34px;height:34px;border-radius:8px;border:2px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:all .15s;flex-shrink:0}
.set-check.done{background:rgba(200,255,0,.12);border-color:var(--accent);color:var(--accent)}
.set-check:active{transform:scale(.88)}
.last-perf{font-size:10px;color:var(--text3);padding:4px 14px 6px;font-style:italic}
.last-perf span{color:var(--accent3)}

/* HISTORY */
.hist-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin:8px 14px;cursor:pointer;transition:border-color .15s}
.hist-item:active{border-color:var(--accent)}
.hist-date{font-size:11px;color:var(--text3);margin-bottom:3px}
.hist-name{font-size:15px;font-weight:700;margin-bottom:6px}
.hist-stats{display:flex;gap:12px;flex-wrap:wrap}
.hist-stat{font-size:11px;color:var(--text2)}
.hist-stat span{color:var(--text);font-weight:600}

/* PROGRESS CHARTS */
.chart-wrap{padding:0 14px;margin:6px 0}
.mini-bars{display:flex;align-items:flex-end;gap:3px;height:70px}
.mbar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.mbar{width:100%;border-radius:3px 3px 0 0;background:var(--accent);opacity:.7;min-height:3px;transition:height .4s ease}
.mbar-lbl{font-size:8px;color:var(--text3);white-space:nowrap}

/* STREAK */
.streak-box{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(200,255,0,.07),rgba(64,200,255,.04));border:1px solid rgba(200,255,0,.18);border-radius:var(--radius);padding:14px;margin:10px 14px}
.streak-num{font-family:'Bebas Neue',sans-serif;font-size:52px;color:var(--accent);line-height:1}

/* ACTIVE BANNER */
.active-banner{background:linear-gradient(135deg,rgba(200,255,0,.09),rgba(64,200,255,.06));border:1px solid rgba(200,255,0,.25);border-radius:var(--radius);padding:12px 14px;margin:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:7px;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,255,0,.4)}70%{box-shadow:0 0 0 8px rgba(200,255,0,0)}100%{box-shadow:0 0 0 0 rgba(200,255,0,0)}}

/* PROGRAM SCREEN */
.day-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:8px 14px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.day-card:active{border-color:var(--accent)}
.day-card.completed{border-color:rgba(200,255,0,.3)}
.day-header{display:flex;align-items:center;justify-content:space-between;padding:14px}
.day-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px}
.day-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px}
.ex-preview{padding:0 14px 12px;display:flex;flex-wrap:wrap;gap:5px}

/* SETTINGS */
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.settings-row:active{background:var(--bg3)}
.settings-title{font-size:14px;font-weight:500}
.settings-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* COACH CHAT */
.chat-wrap{display:flex;flex-direction:column;gap:10px;padding:0 14px}
.chat-msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.6}
.chat-msg.coach{background:var(--bg3);border:1px solid var(--border);align-self:flex-start;border-radius:4px 14px 14px 14px}
.chat-msg.user{background:rgba(200,255,0,.12);border:1px solid rgba(200,255,0,.2);align-self:flex-end;border-radius:14px 4px 14px 14px}
.chat-input-wrap{padding:10px 14px calc(10px + var(--safe-bot));background:var(--bg);border-top:1px solid var(--border);display:flex;gap:8px;position:sticky;bottom:0}
.chat-input{flex:1;padding:10px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none}
.chat-input:focus{border-color:var(--accent)}

/* PROFILE SETUP */
.setup-wrap{padding:30px 20px;display:flex;flex-direction:column;gap:16px;min-height:100%}
.setup-logo{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--accent);letter-spacing:4px;text-align:center}
.setup-sub{font-size:14px;color:var(--text2);text-align:center;margin-top:-10px}

/* PR tag */
.pr-badge{font-size:9px;font-weight:800;color:var(--accent2);background:rgba(255,64,64,.12);border:1px solid rgba(255,64,64,.25);padding:2px 5px;border-radius:4px;letter-spacing:.5px;margin-left:5px}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:6px 0}

/* MISC */
.row{display:flex;gap:8px;align-items:center}
.flex1{flex:1}
.mt8{margin-top:8px}
.mt12{margin-top:12px}
.mt16{margin-top:16px}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 28px;text-align:center}
.empty-icon{font-size:44px;opacity:.25}
.empty-text{font-size:14px;color:var(--text2);line-height:1.6}
.chrono{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent3);font-weight:600}
</style>
</head>

</div>

const USER_ID = (()=>{
  let id = localStorage.getItem('fg_userid');
  if(!id){id='user_'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('fg_userid',id);}
  return id;

async function supaUpsert(table, data){
  try{
    await fetch(`${SUPA_URL}/rest/v1/${table}?on_conflict=id`,{
      method:'POST',
      headers:{...SUPA_HEADERS,'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify(data)
    });
  }catch(e){console.warn('Supabase sync error:',e);}
}

async function supaGet(table, id){
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`,{headers:SUPA_HEADERS});
    const data = await r.json();
    return (data&&data[0]) || null;
  }catch(e){return null;}
}

async function syncToCloud(){
  // Note: apiKey excluded from cloud sync intentionally (security)
  await supaUpsert('profiles',{id:USER_ID, data:{profile:S.profile,programState:S.programState,chatHistory:S.chatHistory}, updated_at:new Date().toISOString()});
  await supaUpsert('program_state',{id:USER_ID, data:S.programState, updated_at:new Date().toISOString()});
}

async function syncSessionToCloud(session){
  await supaUpsert('sessions',{id:session.id, profile_id:USER_ID, data:session, created_at:new Date().toISOString()});
}

async function loadFromCloud(){
  try{
    // Load profile
    const prof = await supaGet('profiles', USER_ID);
    if(prof&&prof.data){
      if(prof.data&&prof.data.profile) S.profile = prof.data.profile;
      if(prof.data&&prof.data.programState) S.programState = prof.data.programState;
      // apiKey intentionally excluded from cloud - stays local only
      if(prof.data&&prof.data.chatHistory) S.chatHistory = prof.data.chatHistory;
    }
    // Load sessions
    const r = await fetch(`${SUPA_URL}/rest/v1/sessions?profile_id=eq.${USER_ID}&order=created_at.desc`,{headers:SUPA_HEADERS});
    const sessions = await r.json();
    if(sessions && sessions.length > 0){
      S.history = sessions.map(s=>s.data);
    }
    // Save to local cache
    saveLocal();
    return true;
  }catch(e){
    console.warn('Could not load from cloud, using local data');
    return false;
  }
}

// AUDIO (son de fin de timer)
// ═══════════════════════════════════════
function playBeep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const beep=(freq,start,dur)=>{
      const o=ctx.createOscillator();
      const g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=freq;
      g.gain.setValueAtTime(.3,ctx.currentTime+start);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+start+dur);
      o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+dur);
    };
    beep(880,0,.1);beep(880,.15,.1);beep(1100,.3,.2);
  }catch(e){}
}

// ═══════════════════════════════════════
// TIMER — timestamp-based (survives lock screen)
// ═══════════════════════════════════════
let timerInt=null,timerEndTs=0,timerTotalSec=0,timerAdj=0;
function startTimer(sec){
  if(timerInt)clearInterval(timerInt);
  timerTotalSec=sec;
  timerEndTs=Date.now()+sec*1000;
  timerAdj=0;
  document.getElementById('rest-timer').style.display='flex';
  updateTimerUI();
  timerInt=setInterval(()=>{
    const left=Math.round((timerEndTs-Date.now())/1000);
    if(left<=0){stopTimer();playBeep();return;}
    updateTimerUI();
  },500);
}
function updateTimerUI(){
  const left=Math.max(0,Math.round((timerEndTs-Date.now())/1000));
  const total=timerTotalSec;
  const m=Math.floor(left/60),s=left%60;
  const el=document.getElementById('timer-val');
  const bar=document.getElementById('timer-bar');
  if(el)el.textContent=`${m}:${s.toString().padStart(2,'0')}`;
  if(bar)bar.style.width=(left/total*100)+'%';
}
function stopTimer(){
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  document.getElementById('rest-timer').style.display='none';
}
function addTime(s){timerEndTs+=s*1000;updateTimerUI();}

// ═══════════════════════════════════════
// CHRONO — timestamp-based (survives lock screen)
// ═══════════════════════════════════════
let chronoInt=null;
function startChrono(){
  if(chronoInt)clearInterval(chronoInt);
  // Use visibilitychange to resync after lock screen
  document.removeEventListener('visibilitychange',onVisibilityChange);
  document.addEventListener('visibilitychange',onVisibilityChange);
  chronoInt=setInterval(()=>{
    if(S.active&&S.currentNav==='workout'){
      const el=document.getElementById('chrono-display');
      if(el)el.textContent='⏱ '+formatDur(Date.now()-S.active.startTime);
    }
  },1000);
}
function stopChrono(){
  if(chronoInt){clearInterval(chronoInt);chronoInt=null;}
  document.removeEventListener('visibilitychange',onVisibilityChange);
}
function onVisibilityChange(){
  if(!document.hidden&&S.active){
    // Resync timer after returning from lock screen
    const el=document.getElementById('chrono-display');
    if(el)el.textContent='⏱ '+formatDur(Date.now()-S.active.startTime);
    updateTimerUI();
  }
}

function getIncrement(exName){
  var n=exName.toLowerCase();
  // Bodyweight - no weight suggestion
  if(n.includes('dip')&&!n.includes('db')&&!n.includes('seated')) return 0;
  if(n.includes('pull-up')||n.includes('chin-up')||n.includes('dead hang')) return 0;
  // Barbell / EZ-Bar - 5 lbs increment (2.5 each side)
  if(n.includes('barbell')||n.includes('ez-bar')||n.includes('belt squat')||n.includes('rdl')) return 5;
  // Dumbbell - 2.5 lbs increment
  if(n.includes(' db ')||n.startsWith('db ')||n.includes('dumbbell')||n.includes('zottman')||n.includes('hammer curl')||n.includes('alternating')) return 2.5;
  // Everything else (machine, cable, pulldown, etc.) - 2.5 lbs
  return 2.5;
}

function getLastExPerf(exName){
  // Get up to 12 sessions for this exercise
  var perfs=[];
  S.history.forEach(function(h){
    var ex=(h.exercises||[]).find(function(e){return e.name===exName;});
    if(ex){
      var done=ex.sets.filter(function(s){return s.done&&s.weight&&s.reps&&!s.flag;});
      var flagged=ex.sets.filter(function(s){return s.done&&s.flag;});
      if(done.length>0){
        var bestWeight=Math.max.apply(null,done.map(function(s){return parseFloat(s.weight)||0;}));
        var bestReps=done.reduce(function(b,s){return parseFloat(s.weight)===bestWeight&&parseInt(s.reps)>b?parseInt(s.reps):b;},0);
        var rpeArr=done.filter(function(s){return s.rpe;}).map(function(s){return s.rpe;});
        var avgRpe=rpeArr.length>0?(rpeArr.reduce(function(a,b){return a+b;},0)/rpeArr.length).toFixed(1):null;
        perfs.push({
          date:h.date,
          sets:done.map(function(s){return {weight:parseFloat(s.weight)||0,reps:parseInt(s.reps)||0,rpe:s.rpe||null};}),
          bestWeight:bestWeight,
          bestReps:bestReps,
          avgRpe:avgRpe,
          hasFlag:flagged.length>0,
          flagTypes:[...new Set(flagged.map(function(s){return s.flag||'';}))].join(',')
        });
      }
    }
  });
  return perfs; // Most recent first
}

function buildExerciseContext(){
  var aw=S.active;
  if(!aw) return '';
  var nl='\n';
  var lines=[];

  aw.exercises.forEach(function(ex){
    var perfs=getLastExPerf(ex.name);
    var inc=getIncrement(ex.name);
    var repRange=ex.targetReps||'6-8';
    var parts=repRange.split('-');
    var repHigh=parseInt(parts[parts.length-1])||8;
    var isBodyweight=inc===0;

    // Trend analysis over 12 sessions
    var trend='';
    var weightTrend='stable';
    if(perfs.length>=3){
      var recent3=perfs.slice(0,3).map(function(p){return p.bestWeight;});
      var older3=perfs.slice(Math.max(0,perfs.length-3)).map(function(p){return p.bestWeight;});
      var avgRecent=recent3.reduce(function(a,b){return a+b;},0)/recent3.length;
      var avgOlder=older3.reduce(function(a,b){return a+b;},0)/older3.length;
      if(avgRecent>avgOlder+2) weightTrend='progression';
      else if(avgRecent<avgOlder-2) weightTrend='regression';
      else weightTrend='plateau';
    }

    // Check plateau duration
    var plateauWeeks=0;
    if(perfs.length>=2){
      var baseW=perfs[0].bestWeight;
      for(var i=1;i<perfs.length;i++){
        if(Math.abs(perfs[i].bestWeight-baseW)<=2) plateauWeeks++;
        else break;
      }
    }

    // Recent flags
    var recentFlags=perfs.slice(0,4).filter(function(p){return p.hasFlag;}).map(function(p){return p.flagTypes;}).join(',');

    // Build condensed 12-session history
    var histStr='Aucun historique';
    if(perfs.length>0){
      // Last 12 sessions condensed: date|bestW x bestR|RPE
      histStr=perfs.slice(0,12).map(function(p){
        var d=new Date(p.date);
        var dateStr=(d.getMonth()+1)+'/'+(d.getDate());
        var rpeStr=p.avgRpe?'RPE'+p.avgRpe:'';
        var flagStr=p.hasFlag?'[FLAG:'+p.flagTypes+']':'';
        // Check if rep target was reached
        var repTarget=p.sets.some(function(s){return s.reps>=repHigh;})?'✓':'✗';
        return dateStr+':'+p.bestWeight+'lbs x'+p.bestReps+repTarget+(rpeStr?' '+rpeStr:'')+(flagStr?' '+flagStr:'');
      }).join(' | ');
    }

    var summary=ex.name+
      '|Plage:'+repRange+
      '|Increment:'+(isBodyweight?'poids corps':inc+'lbs')+
      '|Tendance:'+weightTrend+
      (plateauWeeks>1?'|Plateau:'+plateauWeeks+'seances':'')+
      (recentFlags?'|Flags recents:'+recentFlags:'')+
      '|Historique(12sem):'+histStr;

    lines.push(summary);
  });

  return lines.join(nl);
}

function initWorkout(week,day,fatigue,stress){
  var exs=PROGRAM[week][day]||[];
  var customRest=S.customRestTimes||{};

  S.active={
    id:uid(),week:week,dayName:day,startTime:Date.now(),
    fatigue:fatigue||null,stress:stress||null,
    exercises:exs.map(function(e){
      var lp=getLastExPerf(e.name);
      var lastSets=lp.length>0?lp[0].sets:[];
      return {
        name:e.name,url:e.url,technique:e.technique,
        targetReps:e.reps,rest:e.rest,
        restSec:customRest[e.name]!==undefined?customRest[e.name]:e.restSec,
        sets:Array.from({length:e.sets},function(_,si){
          var last=lastSets[si]||lastSets[lastSets.length-1]||{weight:'',reps:''};
          return {weight:last.weight||'',reps:last.reps||'',rpe:'',done:false,flag:null,setType:'normal'};
        }),
        note:'',aiSuggestion:null
      };
    })
  };
  save();

  if(S.apiKey){
    window._briefWeek=week;window._briefDay=day;
    showModal(
      '<div class="modal-handle"></div>'+
      '<div style="text-align:center;padding:16px 0">'+
        '<div style="font-size:36px;margin-bottom:12px">🤖</div>'+
        '<div style="font-weight:700;font-size:17px;margin-bottom:8px">Analyse en cours...</div>'+
        '<div style="font-size:13px;color:var(--text2);line-height:1.6">Le coach calcule tes charges<br>et prepare ton briefing</div>'+
        '<div style="margin-top:16px;height:3px;background:var(--border);border-radius:2px;overflow:hidden">'+
          '<div id="ai-progress-bar" style="height:100%;width:0%;background:var(--accent);border-radius:2px;transition:width 3s ease"></div>'+
        '</div>'+
      '</div>'+
      '<div style="margin-top:14px">'+
        '<button class="btn btn-ghost btn-full btn-sm" onclick="closeModal();nav(\'workout\');renderWorkout()">Passer</button>'+
      '</div>'
    );
    setTimeout(function(){var b=document.getElementById('ai-progress-bar');if(b)b.style.width='85%';},100);
    getAIChargesAndBriefing(week,day,fatigue,stress);
  }else{
    nav('workout');
  }
}

async function getAIChargesAndBriefing(week,day,fatigue,stress){
  var exCtx=buildExerciseContext();
  var ps=S.programState;
  var p=S.profile||{};
  var fatigueLabel=['','Epuise','Fatigue','Normal','Bien','Excellent'];
  var stressLabel=['','Tres stresse','Stresse','Neutre','Calme','Zen'];
  var wellStr=(fatigue?fatigueLabel[fatigue]+fatigue+'/5':'?')+'|'+(stress?stressLabel[stress]+stress+'/5':'?');
  var nl='\n';

  var systemPrompt='Coach musculation surcharge progressive. Reponds JSON UNIQUEMENT sans texte ni markdown.';
  var userMsg=
    'Athlete:'+( p.name||'?')+' Sem:'+week+'/12 Cycle:'+(ps.cycleCount+1)+' Seances:'+S.history.length+' EnergieMental:'+wellStr+nl+
    'EXERCICES:'+nl+exCtx+nl+nl+
    'REGLES: barbell/EZ=+5lbs|DB/machine/cable=+2.5lbs|corps=reps. Augmenter si borne haute+RPE<=8. Maintenir si dans plage ou RPE8-9. Reduire si sous plage/RPE>=9/flags douleur/energie<=2.'+nl+
    'RETOURNE: {"briefing":"50 mots max","charges":{"NOM_EXACT":{"weight":0,"reps":0,"note":"court"}}}';

  try{
    // Timeout after 20 seconds
    var controller=new AbortController();
    var timeout=setTimeout(function(){controller.abort();},20000);

    var resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      signal:controller.signal,
      headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1500,system:systemPrompt,messages:[{role:'user',content:userMsg}]})
    });
    clearTimeout(timeout);

    var data=await resp.json();
    if(data.error){throw new Error(data.error.message);}

    var text=(data.content&&data.content[0]&&data.content[0].text)||'{}';
    text=text.replace(/```json|```/g,'').trim();
    // Find JSON object in response
    var jsonStart=text.indexOf('{');
    var jsonEnd=text.lastIndexOf('}');
    if(jsonStart>=0&&jsonEnd>jsonStart) text=text.slice(jsonStart,jsonEnd+1);
    var result=JSON.parse(text);

    // Apply AI charge suggestions
    if(result.charges&&S.active){
      S.active.exercises.forEach(function(ex){
        var sug=result.charges[ex.name];
        if(sug&&sug.weight>0){
          ex.aiSuggestion={weight:sug.weight,reps:sug.reps||'',note:sug.note||''};
          ex.sets.forEach(function(s){if(!s.done){s.weight=sug.weight;s.reps=sug.reps||'';}});
        }
      });
      save();
    }

    // Complete progress bar
    var bar=document.getElementById('ai-progress-bar');
    if(bar) bar.style.width='100%';

    setTimeout(function(){
      closeModal();
      showModal(
        '<div class="modal-handle"></div>'+
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'+
          '<div style="font-size:28px">🤖</div>'+
          '<div style="font-weight:700;font-size:16px">Charges + Briefing prets!</div>'+
        '</div>'+
        '<div style="font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:12px;padding:12px;background:var(--bg3);border-radius:10px;border:1px solid var(--border)">'+
          (result.briefing||'Bonne seance!')+
        '</div>'+
        '<div style="font-size:11px;color:var(--accent);margin-bottom:14px">Charges recommandees pre-remplies dans ta seance</div>'+
        '<button class="btn btn-primary btn-full" onclick="closeModal();nav(\'workout\');renderWorkout()">Commencer →</button>'
      );
    },300);

  }catch(e){
    // On any error (timeout, parse error, API error) - just start workout normally
    closeModal();
    var errMsg=e.name==='AbortError'?'Delai depasse — charges precedentes utilisees.':'Erreur IA — charges precedentes utilisees.';
    // Show brief error then navigate
    showModal(
      '<div class="modal-handle"></div>'+
      '<div style="text-align:center;padding:10px 0">'+
        '<div style="font-size:28px;margin-bottom:8px">⚠️</div>'+
        '<div style="font-size:14px;color:var(--text2)">'+errMsg+'</div>'+
      '</div>'+
      '<div style="margin-top:14px"><button class="btn btn-primary btn-full" onclick="closeModal();nav(\'workout\');renderWorkout()">Commencer quand meme</button></div>'
    );
  }
}

function renderWorkout(){
  var scr=document.getElementById('screen');
  scr.style.paddingBottom='';
  scr.style.overflow='';
  scr.style.display='';
  scr.style.flexDirection='';
  var aw=S.active;

  document.getElementById('topbar-right').innerHTML=aw?
    '<button class="btn btn-ghost btn-sm" onclick="showAbandon()">Abandonner</button>'+
    '<button class="btn btn-primary btn-sm" onclick="finishWorkout()">Terminer</button>':'';

  if(!aw){
    scr.innerHTML='<div class="empty"><div class="empty-icon">🏋️</div><div class="empty-text">Aucune seance en cours.<br>Demarre un jour depuis l\'accueil.</div><button class="btn btn-primary" onclick="nav(\'home\')">Voir le programme</button></div>';
    return;
  }

  startChrono();
  var elapsed=formatDur(Date.now()-aw.startTime);
  var html='<div style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center">'+
    '<div>'+
      '<div style="font-size:17px;font-weight:700">'+(DAY_ICONS[aw.dayName]||'🏋️')+' '+aw.dayName+'</div>'+
      '<div style="font-size:11px;color:var(--text2)" id="chrono-display">⏱ '+elapsed+' · Sem. '+aw.week+'</div>'+
    '</div>'+

function renderExBlock(ex,ei){
  var lastPerf=getLastExPerf(ex.name);
  var lp=lastPerf.length>0?lastPerf[0]:null;
  var lastPerfHtml=lp?
    '<div class="last-perf" onclick="showExHistoryByEl(this)" data-exname="'+encodeURIComponent(ex.name)+'">Dernière fois: <span>'+lp.bestWeight+' lbs × '+lp.bestReps+' reps</span> ('+fmtAgo(lp.date)+') 📈</div>':
    '<div class="last-perf" style="color:var(--text3)">Premier essai!</div>';

  var restSec=ex.restSec||120;
  var restMin=Math.floor(restSec/60),restS=restSec%60;
  var restLabel=restS>0?restMin+'m'+restS+'s':restMin+'min';

  // AI suggestion badge
  var aiHtml='';
  if(ex.aiSuggestion){
    aiHtml='<div style="margin:0 14px 6px;padding:7px 10px;background:rgba(200,255,0,.08);border:1px solid rgba(200,255,0,.2);border-radius:8px;font-size:11px;color:var(--accent)">'+
      '🤖 IA: '+ex.aiSuggestion.weight+' lbs × '+ex.aiSuggestion.reps+' reps — '+ex.aiSuggestion.note+

  }

  var setsHtml=ex.sets.map(function(s,si){
    return '<div class="set-row"'+( s.flag?'style="background:rgba(255,157,0,.08);border-color:rgba(255,157,0,.3)"':'')+'>'+
      '<div class="set-num" style="'+(s.setType==='warmup'?'color:var(--accent3)':s.setType==='drop'?'color:var(--accent4)':s.setType==='failure'?'color:var(--accent2)':'color:var(--text3)')+';cursor:pointer" onclick="cycleSetType('+ei+','+si+')" title="Type">'+getSetTypeIcon(s.setType)+'</div>'+
      '<input class="set-input" type="number" placeholder="lbs" value="'+(s.weight||'')+'" inputmode="decimal" min="0" step="2.5" onchange="updSet('+ei+','+si+',\'weight\',this.value)">'+
      '<input class="set-input" type="number" placeholder="'+ex.targetReps+'" value="'+(s.reps||'')+'" inputmode="numeric" min="0" onchange="updSet('+ei+','+si+',\'reps\',this.value)">'+
      '<div style="display:flex;flex-direction:column;gap:2px">'+
        '<input class="set-rpe" type="number" placeholder="RPE" value="'+(s.rpe||'')+'" inputmode="numeric" min="1" max="10" onchange="updSet('+ei+','+si+',\'rpe\',this.value)">'+
        (s.flag?'<div style="font-size:9px;text-align:center;color:var(--accent4)">'+s.flag+'</div>':'<div style="font-size:9px;text-align:center;color:var(--text3);cursor:pointer" onclick="showFlagMenu('+ei+','+si+')">🚩</div>')+
      '</div>'+
      '<div class="set-check'+(s.done?' done':'')+'" onclick="toggleSet('+ei+','+si+')">'+(s.done?'✓':'')+'</div>'+
    '</div>';
  }).join('');

  return '<div class="ex-block">'+
    '<div class="ex-header">'+
      '<div>'+
        '<a href="'+ex.url+'" target="_blank" class="ex-name">'+ex.name+' 🔗</a>'+
        '<div class="ex-meta">'+ex.sets.length+' séries · '+ex.targetReps+' rép.</div>'+
      '</div>'+
      '<div style="display:flex;gap:5px;align-items:center">'+
        '<button class="btn btn-ghost btn-sm" onclick="showExHistoryByEl(this)" data-exname="'+encodeURIComponent(ex.name)+'" title="Historique">📈</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="showRestEdit('+ei+')" title="Repos">⏱'+restLabel+'</button>'+
        '<button class="btn btn-secondary btn-sm" onclick="addSet('+ei+')">+</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="delSet('+ei+')">−</button>'+
      '</div>'+
    '</div>'+
    (ex.technique?'<div class="ex-technique">⚡ DERNIÈRE SÉRIE: '+ex.technique+'</div>':'')+
    aiHtml+

      '<input type="text" placeholder="Note sur cet exercice..." value="'+(ex.note||'')+'" style="font-size:12px;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);width:100%;outline:none" onchange="updExNote('+ei+',this.value)">'+
    '</div>'+
    '<div class="set-headers" style="grid-template-columns:28px 1fr 1fr 42px 34px">'+
      '<div class="set-hdr">TYPE</div>'+
      '<div class="set-hdr">LBS</div>'+
      '<div class="set-hdr">REPS</div>'+
      '<div class="set-hdr" onclick="showRPETooltip()" style="cursor:pointer">RPE🚩ℹ️</div>'+
      '<div></div>'+
    '</div>'+
    setsHtml+
    '<div style="padding:8px 14px 10px">'+
      '<button class="btn btn-ghost btn-full btn-sm" onclick="startTimer('+restSec+')">⏱ Timer repos ('+restLabel+')</button>'+
    '</div>'+
  '</div>';
}

function updSet(ei,si,field,val){
  if(!S.active)return;
  S.active.exercises[ei].sets[si][field]=field==='rpe'?parseInt(val)||'':parseFloat(val)||'';
  save();
}

function toggleSet(ei,si){
  if(!S.active)return;
  var s=S.active.exercises[ei].sets[si];
  s.done=!s.done;
  save();
  if(s.done)startTimer(S.active.exercises[ei].restSec||120);
  renderWorkout();
}

function addSet(ei){
  if(!S.active)return;
  var sets=S.active.exercises[ei].sets;
  var last=sets[sets.length-1]||{weight:'',reps:'',rpe:'',done:false,flag:null,setType:'normal'};
  sets.push({weight:last.weight,reps:last.reps,rpe:'',done:false,flag:null,setType:'normal'});
  save();renderWorkout();
}

function delSet(ei){
  if(!S.active)return;
  const sets=S.active.exercises[ei].sets;
  if(sets.length>1)sets.pop();
  save();renderWorkout();
}

function showAbandon(){
  showConfirm('Abandonner la séance?','Elle ne sera PAS sauvegardée dans ton historique.',()=>{
    S.active=null;save();stopTimer();stopChrono();
    nav('home');
  },'Abandonner','Continuer');
}

function finishWorkout(){
  if(!S.active)return;
  const aw=S.active;
  let vol=0;
  aw.exercises.forEach(ex=>{
    ex.sets.filter(s=>s.done&&s.weight&&s.reps).forEach(s=>{vol+=(parseFloat(s.weight)||0)*(parseInt(s.reps)||0);});
  });
  const session={
    id:uid(),week:aw.week,dayName:aw.dayName,
    date:Date.now(),duration:Date.now()-aw.startTime,
    exercises:aw.exercises,volume:vol
  };
  S.history.unshift(session);
  syncSessionToCloud(session);

  // Advance program state
  S.programState.daysCompleted++;
  if(S.programState.daysCompleted%4===0){
    // Completed a full cycle of 4 days = advance week
    S.programState.week++;
    if(S.programState.week>12){
      S.programState.week=1;
      S.programState.cycleCount++;
    }
  }

  S.active=null;
  stopTimer();stopChrono();
  save();

  showDebriefPrompt(session);
}

// LAST PERFORMANCE LOOKUP
// ═══════════════════════════════════════
function getLastPerf(exName){
  for(const session of S.history){
    const ex=(session.exercises&&session.exercises.find)(e=>e.name===exName);
    if(ex){
      const doneSets=ex.sets.filter(s=>s.done&&s.weight&&s.reps);
      if(doneSets.length>0){
        const best=doneSets.reduce((b,s)=>(parseFloat(s.weight)||0)*(parseInt(s.reps)||0)>(parseFloat(b.weight)||0)*(parseInt(b.reps)||0)?s:b);
        return{weight:best.weight,reps:best.reps,date:session.date};
      }
    }
  }
  return null;
}

// ── VOLUME TAB ──
function renderVolumeTab(){
  const filter=window._volFilter||'3m';
  const now=Date.now();
  const filterMs={'30d':30*86400000,'3m':90*86400000,'1y':365*86400000,'all':10*365*86400000};
  const sinceMs=filterMs[filter]||filterMs['3m'];
  const filtered=S.history.filter(function(h){return h.date>now-sinceMs;});
  
  const weeks=[];
  for(let w=7;w>=0;w--){
    const s2=now-(w+1)*7*86400000,e2=now-w*7*86400000;
    const vol=filtered.filter(function(h){return h.date>=s2&&h.date<e2;}).reduce(function(a,h){return a+(h.volume||0);},0);
    weeks.push({lbl:w===0?'Sem.':'S-'+w,vol});
  }
  const maxVol=Math.max.apply(null,weeks.map(function(w){return w.vol;}).concat([1]));
  const barsHtml=weeks.map(function(w){
    const h=Math.max(4,Math.round((w.vol/maxVol)*56));
    return '<div class="mbar-wrap"><div class="mbar" style="height:'+h+'px"></div><div class="mbar-lbl">'+w.lbl+'</div></div>';
  }).join('');

  const totalVol=filtered.reduce(function(a,h){return a+(h.volume||0);},0);
  const avgDur=filtered.length>0?filtered.reduce(function(a,h){return a+(h.duration||0);},0)/filtered.length:0;
  const perWeek=filtered.length>0?(filtered.length/(sinceMs/7/86400000)).toFixed(1):0;
  
  let volComp='';
  if(S.history.length>=2){
    const diff=S.history[0].volume-S.history[1].volume;
    const pct=S.history[1].volume>0?Math.round(diff/S.history[1].volume*100):0;
    volComp='<span style="color:'+(diff>=0?'var(--accent)':'var(--accent2)')+';font-size:12px;margin-left:6px">'+(diff>=0?'+':'')+pct+'% vs prec.</span>';
  }

  const filterBtns=[['30d','30j'],['3m','3 mois'],['1y','1 an'],['all','Tout']].map(function(fv){
    const a=filter===fv[0];
    return '<button onclick="window._volFilter=\''+fv[0]+'\';renderProgress()" style="padding:5px 10px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid '+(a?'var(--accent)':'var(--border)')+';background:'+(a?'var(--accent)':'var(--bg3)')+';color:'+(a?'#0d0d0d':'var(--text2)')+'">'+fv[1]+'</button>';
  }).join('');

  const freq={};
  filtered.forEach(function(h){(h.exercises||[]).forEach(function(e){freq[e.name]=(freq[e.name]||0)+1;});});
  const topEx=Object.entries(freq).sort(function(a,b){return b[1]-a[1];}).slice(0,5);

  return '<div style="display:flex;gap:6px;padding:0 14px 8px">'+filterBtns+'</div>'+
    '<div class="card"><div class="card-title">LBS SOULEVÉS / SEMAINE</div><div class="mini-bars">'+barsHtml+'</div></div>'+
    '<div class="stat-grid" style="padding:0 14px;margin:8px 0">'+
      '<div class="stat-box"><div class="stat-val">'+fmtLbs(totalVol)+'</div><div class="stat-lbl">Volume total (lbs)</div></div>'+
      '<div class="stat-box"><div class="stat-val">'+perWeek+'</div><div class="stat-lbl">Séances/semaine</div></div>'+
      '<div class="stat-box"><div class="stat-val">'+filtered.length+'</div><div class="stat-lbl">Séances totales</div></div>'+
      '<div class="stat-box"><div class="stat-val">'+formatDur(avgDur)+'</div><div class="stat-lbl">Durée moyenne</div></div>'+
    '</div>'+
    (S.history.length>0?
      '<div class="sec-hdr"><h2>DERNIÈRE SÉANCE</h2></div>'+
      '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">'+
        '<div><div style="font-weight:700">'+S.history[0].dayName+'</div><div style="font-size:11px;color:var(--text3)">'+formatDate(S.history[0].date)+'</div></div>'+
        '<div style="text-align:right"><div style="font-family:JetBrains Mono,monospace;font-size:18px;color:var(--accent)">'+fmtLbs(S.history[0].volume)+' lbs</div>'+volComp+'</div>'+
      '</div></div>':'')+
    '<div class="sec-hdr"><h2>CONSISTANCE</h2></div>'+
    '<div class="card"><div class="card-title">90 DERNIERS JOURS</div><div style="display:flex;flex-wrap:wrap;gap:3px">'+buildHeatmap()+'</div></div>'+
    '<div class="sec-hdr"><h2>EXERCICES FRÉQUENTS</h2></div>'+
    topEx.map(function(ne){return '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)"><div style="font-size:13px;font-weight:500">'+ne[0]+'</div><span class="tag tag-accent">'+ne[1]+'×</span></div>';}).join('')+

  const filter=window._muscleFilter||'30d';
  const now=Date.now();
  const filterMs={'30d':30*86400000,'3m':90*86400000,'1y':365*86400000,'all':10*365*86400000};
  const sinceMs=filterMs[filter]||filterMs['30d'];
  const filtered=S.history.filter(function(h){return h.date>now-sinceMs;});

  const muscleSets={},muscleVol={};
  filtered.forEach(function(h){
    (h.exercises||[]).forEach(function(ex){
      const muscle=MUSCLE_MAP[ex.name]||'Autre';
      const doneSets=ex.sets.filter(function(s){return s.done&&!s.flag;});
      muscleSets[muscle]=(muscleSets[muscle]||0)+doneSets.length;
      doneSets.forEach(function(s){muscleVol[muscle]=(muscleVol[muscle]||0)+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0);});
    });
  });

  const pushMuscles=['Poitrine','Épaules','Bras'];
  const pullMuscles=['Dos','Avant-bras'];
  const pushSets=pushMuscles.reduce(function(a,m){return a+(muscleSets[m]||0);},0);
  const pullSets=pullMuscles.reduce(function(a,m){return a+(muscleSets[m]||0);},0);
  const ratio=pullSets>0?(pushSets/pullSets).toFixed(2):'N/A';

  const allMuscles=Object.keys(muscleSets).sort(function(a,b){return muscleSets[b]-muscleSets[a];});
  const maxSets=Math.max.apply(null,Object.values(muscleSets).concat([1]));

  const filterBtns=[['30d','30j'],['3m','3 mois'],['1y','1 an'],['all','Tout']].map(function(fv){
    const a=filter===fv[0];
    return '<button onclick="window._muscleFilter=\''+fv[0]+'\';renderProgress()" style="padding:5px 10px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid '+(a?'var(--accent)':'var(--border)')+';background:'+(a?'var(--accent)':'var(--bg3)')+';color:'+(a?'#0d0d0d':'var(--text2)')+'">'+fv[1]+'</button>';
  }).join('');

  return '<div style="display:flex;gap:6px;padding:0 14px 8px">'+filterBtns+'</div>'+
    '<div class="sec-hdr"><h2>SÉRIES PAR MUSCLE</h2></div>'+
    '<div class="card">'+
      (allMuscles.length===0?'<div style="color:var(--text3);font-size:13px">Aucune donnée</div>':
      allMuscles.map(function(m){
        const pct=Math.round((muscleSets[m]/maxSets)*100);
        return '<div style="margin-bottom:10px">'+
          '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:13px;font-weight:600">'+m+'</span><span style="font-size:12px;color:var(--text2)">'+muscleSets[m]+' séries · '+fmtLbs(muscleVol[m])+' lbs</span></div>'+
          '<div style="height:8px;background:var(--bg3);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--accent);border-radius:4px;opacity:.8"></div></div>'+
        '</div>';
      }).join(''))+
    '</div>'+
    '<div class="stat-grid" style="padding:0 14px;margin:8px 0">'+
      '<div class="stat-box"><div class="stat-val">'+ratio+'</div><div class="stat-lbl">Ratio Push/Pull</div></div>'+
      '<div class="stat-box"><div class="stat-val">'+(pushSets+pullSets)+'</div><div class="stat-lbl">Séries totales</div></div>'+
    '</div>';
}

function buildHeatmap(){

  var today=new Date();today.setHours(0,0,0,0);
  var html='';
  for(var d=89;d>=0;d--){
    var day=new Date(today);day.setDate(day.getDate()-d);
    var ts=day.getTime();
    var has=sessionDays.has(ts);
    html+='<div style="width:10px;height:10px;border-radius:2px;background:'+(has?'var(--accent)':'var(--bg3)')+';opacity:'+(has?'.9':'.4')+';border:1px solid '+(has?'rgba(200,255,0,.3)':'var(--border)')+'"></div>';
  }
  return html;
}

function buildPRs(){
  var prs={};
  S.history.forEach(function(h){
    (h.exercises||[]).forEach(function(ex){
      ex.sets.filter(function(s){return s.done&&s.weight&&s.reps&&!s.flag;}).forEach(function(s){
        var w=parseFloat(s.weight)||0,r=parseInt(s.reps)||0;
        if(!prs[ex.name]||w>prs[ex.name].weight||(w===prs[ex.name].weight&&r>prs[ex.name].reps))
          prs[ex.name]={name:ex.name,weight:w,reps:r,date:h.date};
      });
    });
  });
  return Object.values(prs).sort(function(a,b){return b.date-a.date;});
}

function est1RM(w,r){return Math.round(parseFloat(w)*(1+parseInt(r)/30));}

function renderExChart(){
  var name=document.getElementById('ex-chart-select');
  if(!name) return;
  name=name.value;
  var area=document.getElementById('ex-chart-area');
  if(!area)return;
  if(!name){area.innerHTML='<span style="font-size:12px;color:var(--text3)">Sélectionne un exercice</span>';return;}
  var points=[];
  S.history.slice().reverse().forEach(function(h){
    var ex=(h.exercises||[]).find(function(e){return e.name===name;});
    if(ex){
      var done=ex.sets.filter(function(s){return s.done&&s.weight&&s.reps&&!s.flag;});
      if(done.length>0){
        var best=done.reduce(function(b,s){return parseFloat(s.weight)*parseInt(s.reps)>parseFloat(b.weight)*parseInt(b.reps)?s:b;});
        points.push({date:h.date,weight:parseFloat(best.weight),reps:parseInt(best.reps)});
      }
    }
  });
  if(points.length===0){area.innerHTML='<span style="font-size:12px;color:var(--text3)">Aucune donnée pour cet exercice</span>';return;}
  if(points.length===1){area.innerHTML='<div style="text-align:center"><div style="font-size:22px;font-weight:700;color:var(--accent)">'+points[0].weight+' lbs</div><div style="font-size:11px;color:var(--text3)">1 séance enregistrée</div></div>';return;}
  var maxW=Math.max.apply(null,points.map(function(p){return p.weight;}));
  var minW=Math.min.apply(null,points.map(function(p){return p.weight;}));
  var range=maxW-minW||1;
  var W=280,H=60,pad=4;
  var pts=points.map(function(p,i){
    return {x:pad+(i/(points.length-1))*(W-pad*2),y:H-pad-(((p.weight-minW)/range)*(H-pad*2)),weight:p.weight,reps:p.reps,date:p.date};
  });
  var path='M'+pts.map(function(p){return p.x+','+p.y;}).join(' L');
  var area2='M'+pts[0].x+','+H+' L'+pts.map(function(p){return p.x+','+p.y;}).join(' L')+' L'+pts[pts.length-1].x+','+H+' Z';
  area.innerHTML='<div style="width:100%;overflow:hidden">'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:'+H+'px">'+
      '<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c8ff00" stop-opacity=".3"/><stop offset="100%" stop-color="#c8ff00" stop-opacity="0"/></linearGradient></defs>'+
      '<path d="'+area2+'" fill="url(#lg)"/>'+
      '<path d="'+path+'" fill="none" stroke="#c8ff00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
      pts.map(function(p){return '<circle cx="'+p.x+'" cy="'+p.y+'" r="3" fill="#c8ff00"/>';}).join('')+
    '</svg>'+
    '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:4px">'+
      '<span>'+formatDate(points[0].date)+'</span>'+
      '<span style="color:var(--accent);font-weight:700">'+points[points.length-1].weight+' lbs × '+points[points.length-1].reps+' reps</span>'+
      '<span>'+formatDate(points[points.length-1].date)+'</span>'+
    '</div>'+
    '<div style="display:flex;justify-content:space-between;font-size:11px;margin-top:6px">'+
      '<div style="color:var(--text3)">Min: <span style="color:var(--text)">'+minW+' lbs</span></div>'+
      '<div style="color:var(--text3)">Max: <span style="color:var(--accent2)">'+maxW+' lbs</span></div>'+
      '<div style="color:var(--text3)">1RM est.: <span style="color:var(--accent3)">'+est1RM(points[points.length-1].weight,points[points.length-1].reps)+' lbs</span></div>'+
    '</div>'+
  '</div>';
}

function getLastPerf(exName){
  for(var i=0;i<S.history.length;i++){
    var session=S.history[i];
    var ex=(session.exercises||[]).find(function(e){return e.name===exName;});
    if(ex){
      var done=ex.sets.filter(function(s){return s.done&&s.weight&&s.reps;});
      if(done.length>0){
        var best=done.reduce(function(b,s){return parseFloat(s.weight)*parseInt(s.reps)>parseFloat(b.weight)*parseInt(b.reps)?s:b;});
        return {weight:best.weight,reps:best.reps,date:session.date};
      }
    }
  }
  return null;
}

function buildCalendar(offset){
  offset=offset||0;
  const now=new Date();
  const base=new Date(now.getFullYear(),now.getMonth()+offset,1);
  const year=base.getFullYear(),month=base.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const months=['Jan','Fev','Mar','Avr','Mai','Jun','Jul','Aou','Sep','Oct','Nov','Dec'];

  // Map each day key to session id for click
  const sessionDayMap={};
  S.history.forEach(function(h){
    var d=new Date(h.date);
    var key=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
    if(!sessionDayMap[key]) sessionDayMap[key]=h.id;
  });

  let html='<div class="card">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+
      '<button onclick="calPrevMonth()" style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:4px 10px;cursor:pointer;font-size:14px">‹</button>'+
      '<div style="font-weight:700;font-size:14px">'+months[month]+' '+year+'</div>'+
      '<button onclick="calNextMonth()" style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:4px 10px;cursor:pointer;font-size:14px">›</button>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center">';

  ['D','L','M','M','J','V','S'].forEach(function(d){
    html+='<div style="font-size:10px;font-weight:700;color:var(--text3);padding-bottom:4px">'+d+'</div>';
  });

  for(var i=0;i<firstDay;i++) html+='<div></div>';

  for(var d=1;d<=daysInMonth;d++){
    var key=year+'-'+month+'-'+d;
    var sessionId=sessionDayMap[key];
    var has=!!sessionId;
    var isToday=d===now.getDate()&&month===now.getMonth()&&year===now.getFullYear();
    if(has){
      if(!window._calSessionMap) window._calSessionMap={};
      window._calSessionMap[key]=sessionId;
      html+='<div data-calkey="'+key+'" onclick="calDayClick(this)" style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:11px;font-weight:600;cursor:pointer;background:var(--accent);color:#0d0d0d">'+d+'</div>';
    } else {
      html+='<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:11px;font-weight:600;background:'+(isToday?'var(--bg3)':'transparent')+';color:'+(isToday?'var(--text)':'var(--text3)')+';border:'+(isToday?'1px solid var(--border)':'none')+'">'+d+'</div>';
    }
  }
  html+='</div></div>';
  return html;
}

function calPrevMonth(){
  var now=new Date();
  window._calOffset=(window._calOffset||0)-1;
  renderProgress();
}
function calNextMonth(){
  window._calOffset=(window._calOffset||0)+1;
  if(window._calOffset>0) window._calOffset=0;
  renderProgress();
}

function buildCoachContext(){
  var ps=S.programState;
  var p=S.profile||{};
  var DAYS_ORDER=['Full Body','Upper','Lower','Arms/Delts'];
  var nextDay=DAYS_ORDER[ps.daysCompleted%4];

  // Recent sessions with details
  var recentSessions=S.history.slice(0,5).map(function(h){
    var rpeArr=[];
    (h.exercises||[]).forEach(function(ex){
      ex.sets.filter(function(s){return s.done&&s.rpe;}).forEach(function(s){rpeArr.push(s.rpe);});
    });
    var avgRpe=rpeArr.length>0?(rpeArr.reduce(function(a,b){return a+b;},0)/rpeArr.length).toFixed(1):'?';
    var fatigue=h.fatigue?'Énergie '+h.fatigue+'/5':'';
    var stress=h.stress?'Stress '+h.stress+'/5':'';
    var wellness=[fatigue,stress].filter(Boolean).join(', ');
    return h.dayName+' (Sem.'+h.week+'): '+fmtLbs(h.volume)+' lbs, '+formatDur(h.duration)+(avgRpe!='?'?', RPE moy '+avgRpe:'')+(wellness?', '+wellness:'')+' — '+formatDate(h.date);
  }).join('\n');

  // PRs with 1RM
  var prs=buildPRs().slice(0,8).map(function(p){
    return p.name+': '+p.weight+' lbs x '+p.reps+' reps (1RM est. '+est1RM(p.weight,p.reps)+' lbs)';
  }).join('\n');

  // Last performance per exercise for next session
  var nextDayExs=(PROGRAM[ps.week]&&PROGRAM[ps.week][nextDay])||[];
  var lastPerfs=nextDayExs.map(function(e){
    var lp=getLastPerf(e.name);
    return e.name+': '+(lp?lp.weight+' lbs x '+lp.reps+' reps ('+fmtAgo(lp.date)+')':'premier essai');
  }).join('\n');

  // Volume trend (last 4 weeks)
  var now=Date.now();
  var weekVols=[];
  for(var w=3;w>=0;w--){
    var s2=now-(w+1)*7*86400000,e2=now-w*7*86400000;
    var vol=S.history.filter(function(h){return h.date>=s2&&h.date<e2;}).reduce(function(a,h){return a+(h.volume||0);},0);
    weekVols.push('S-'+w+': '+fmtLbs(vol)+' lbs');
  }

  // Average RPE trend
  var rpeRecent=S.history.slice(0,8).map(function(h){
    var arr=(h.exercises||[]).flatMap?
      (h.exercises||[]).flatMap(function(ex){return ex.sets.filter(function(s){return s.done&&s.rpe;}).map(function(s){return s.rpe;});}) :
      [].concat.apply([],(h.exercises||[]).map(function(ex){return ex.sets.filter(function(s){return s.done&&s.rpe;}).map(function(s){return s.rpe;});}));
    return arr.length>0?(arr.reduce(function(a,b){return a+b;},0)/arr.length).toFixed(1):null;
  }).filter(Boolean);
  var avgRpeTrend=rpeRecent.length>0?(rpeRecent.reduce(function(a,b){return parseFloat(a)+parseFloat(b);},0)/rpeRecent.length).toFixed(1):'N/A';

  var nl='\n';
  return 'PROFIL:'+nl+
    'Nom:'+(p.name||'?')+' Niveau:'+(p.level||'?')+' Objectif:'+(p.goal||'?')+' Age:'+(p.age||'?')+'ans Poids:'+(p.weight||'?')+'lbs'+nl+nl+
    'PROGRAMME:'+nl+
    'Semaine '+ps.week+'/12 Cycle '+(ps.cycleCount+1)+' Total:'+S.history.length+' seances'+nl+
    'Prochain:'+nextDay+nl+nl+
    'SEANCES RECENTES:'+nl+(recentSessions||'Aucune')+nl+nl+
    'VOLUME (4 sem):'+nl+weekVols.join(' | ')+nl+nl+
    'RPE MOYEN:'+avgRpeTrend+'/10'+nl+nl+
    'RECORDS:'+nl+(prs||'Aucun')+nl+nl+
    'CHARGES PROCHAIN JOUR ('+nextDay+'):'+nl+(lastPerfs||'Premier');
}

async function sendCoachMsg(userMsg){
  S.chatHistory.push({role:'user',content:userMsg});
  save();
  renderCoach();

  if(!S.apiKey){
    S.chatHistory.push({role:'coach',content:'⚠️ Clé API manquante. Va dans Réglages → Clé API Claude pour la configurer.'});
    save();renderCoach();return;
  }

  // Build rich context
  const coachCtx=buildCoachContext();
  const systemPrompt='Tu es le coach IA personnel de FORGE, une app de musculation avancée.'+
    ' Tu analyses les données détaillées de l\'athlète pour donner des conseils précis et personnalisés.'+
    ' Réponds toujours en français. Utilise des lbs, dis séries et répétitions.'+
    ' Sois direct, précis et motivant. Maximum 200 mots par réponse sauf si demande d\'analyse détaillée.\n\n'+
    'DONNÉES COMPLÈTES DE L\'ATHLÈTE:\n'+coachCtx;

  try{

      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:400,
        system:systemPrompt,
        messages:S.chatHistory.map(m=>({role:m.role==='coach'?'assistant':'user',content:m.content}))

async function getDebrief(sessionId){

  }catch(e){
    var el=document.getElementById('debrief-content');
    if(el) el.innerHTML='<div style="color:var(--accent2)">Erreur de connexion.</div>';
  }
}

function exportData(){
  const data={version:2,exportDate:new Date().toISOString(),profile:S.profile,history:S.history,programState:S.programState};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`forge-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(url);
}

function importData(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!d.history&&!d.profile)throw new Error('Format invalide');
        if(!confirm(`Importer ${(d.history&&d.history.length)||0} séances?\nCela remplacera tes données actuelles.`))return;
        if(d.profile)S.profile=d.profile;
        if(d.history)S.history=d.history;
        if(d.programState)S.programState=d.programState;
        S.active=null;save();
        alert('✅ Importation réussie!');renderSettings();
      }catch(err){alert('❌ Fichier invalide: '+err.message);}
    };
    reader.readAsText(file);
  };
  inp.click();
}

// ═══════════════════════════════════════
function showModal(html){
  document.getElementById('modal-root').innerHTML=`
    <div class="modal-overlay" onclick="handleOverlay(event)">
      <div class="modal" onclick="event.stopPropagation()">${html}</div>
    </div>`;
}
function handleOverlay(e){if(e.target.classList.contains('modal-overlay'))closeModal();}
function closeModal(){document.getElementById('modal-root').innerHTML='';}

function showConfirm(title,msg,onConfirm,confirmLabel='Confirmer',cancelLabel='Annuler'){
  showModal(`
    <div class="modal-handle"></div>
    <div style="font-size:17px;font-weight:700;margin-bottom:8px">${title}</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:18px">${msg}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn btn-secondary" onclick="closeModal()">${cancelLabel}</button>
      <button class="btn btn-danger" onclick="closeModal();(${onConfirm.toString()})()">${confirmLabel}</button>
    </div>`);
}

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function formatDur(ms){
  if(!ms||ms<0)return'0m0s';
  const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);
  return h>0?`${h}h${(m%60).toString().padStart(2,'0')}m`:`${m}m${(s%60).toString().padStart(2,'0')}s`;
}
function formatDate(ts){
  const d=new Date(ts);
  const days=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const months=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  return`${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtLbs(v){if(!v)return'0';if(v>=1000)return(v/1000).toFixed(1)+'k';return Math.round(v).toString();}
function fmtAgo(ts){
  const d=Math.floor((Date.now()-ts)/86400000);
  if(d===0)return"aujourd&#39;hui";if(d===1)return"hier";return`il y a ${d} jours`;
}
